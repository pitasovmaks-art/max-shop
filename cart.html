<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Точка Монтажа — Корзина</title>
    <link rel="stylesheet" href="src/cart/cart.css">
    <link rel="stylesheet" href="src/cookie.css">
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="/src/utils/tgid.js?v=20260530b"></script>
</head>
<body style="background:linear-gradient(135deg,#1a1a2e 0%,#2d4a3e 40%,#4a3728 100%);min-height:100vh;">
<div class="app">

    <!-- Header -->
    <header class="header">
        <div class="header__logo">
            <button class="header__back" onclick="location.href='index.html'" aria-label="Назад">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <span class="header__logo-text">Точка Монтажа</span>
        </div>
        <button class="header__clear hidden" id="clearBtn" onclick="confirmClear()">Очистить</button>
    </header>

    <!-- Content -->
    <main class="main" id="main">

        <!-- Cart list -->
        <div class="cart-list hidden" id="cartList"></div>

        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
            <div class="empty-state__icon">🛒</div>
            <p class="empty-state__title">Корзина пуста</p>
            <p class="empty-state__sub">Добавьте товары из каталога</p>
            <a href="index.html" class="empty-state__btn">Перейти в каталог</a>
        </div>


    </main>

    <!-- Summary footer -->
    <div class="cart-footer hidden" id="cartFooter">
        <div class="summary">
            <div class="summary-row">
                <span class="summary-label" id="itemsLabel">Товары</span>
                <span class="summary-value" id="totalPrice">0 ₽</span>
            </div>
            <div class="summary-row summary-row--note">
                <span>🏪 Самовывоз из 3 магазинов</span>
            </div>
        </div>
        <button class="checkout-btn" onclick="(function(){const t=new URLSearchParams(location.search).get('tg_id')||sessionStorage.getItem('tg_id');location.href=t?'checkout.html?tg_id='+t:'checkout.html';})()">
            Оформить заказ
        </button>
    </div>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                <rect x="15" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                <rect x="2" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                <rect x="15" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Каталог</span>
        </a>
        <a href="cart.html" class="nav-item active">
            <div class="nav-icon-wrap">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="nav-badge hidden" id="navBadge">0</span>
            </div>
            <span>Корзина</span>
        </a>
        <a href="src/orders/orders.html" class="nav-item" id="navOrders">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2"/>
                <line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="9" y1="16" x2="13" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Заказы</span>
        </a>
        <button class="nav-item" onclick="openCartSupport()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Поддержка</span>
        </button>
    </nav>

</div>
<script src="src/cart/cart.js?v=20260530b"></script>
<script src="src/cookie.js?v=20260530b"></script>
<script>
(function() {
    const tgId = getTgId();
    if (!tgId) return;
    const navOrders = document.getElementById('navOrders');
    if (navOrders) navOrders.href = 'src/orders/orders.html?tg_id=' + tgId;
})();
let _cartSupportBotUsername = 'id635009278943_1_bot';
fetch('/api/config').then(r=>r.json()).then(cfg=>{ _cartSupportBotUsername = cfg.supportBotUsername||'id635009278943_1_bot'; }).catch(()=>{});
function openCartSupport() {
    const url = 'https://max.ru/' + _cartSupportBotUsername;
    if (window.WebApp?.openLink) window.WebApp.openLink(url); else window.location.href = url;
}
</script>
</body>
</html>
