<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Точка Монтажа — Каталог</title>
    <link rel="stylesheet" href="src/catalog/catalog.css">
    <link rel="stylesheet" href="src/cookie.css">
    <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body style="background:linear-gradient(135deg,#1a1a2e 0%,#2d4a3e 40%,#4a3728 100%);min-height:100vh;">

<!-- City selection screen -->
<div id="city-screen" style="position:fixed;inset:0;z-index:2000;background:linear-gradient(135deg,#1a1a2e 0%,#2d4a3e 40%,#4a3728 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;">
    <div style="font-family:'Oswald',sans-serif;font-size:32px;font-weight:600;color:#fff;letter-spacing:-.5px;margin-bottom:8px;text-align:center;">Точка Монтажа</div>
    <h2 style="font-size:18px;font-weight:600;color:rgba(255,255,255,0.8);margin:0 0 40px;text-align:center;font-weight:400;">Выберите ваш город</h2>
    <div style="display:flex;flex-direction:column;gap:16px;width:100%;max-width:320px;">
        <button onclick="selectCity('krd')" style="width:100%;height:64px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:16px;color:#fff;font-size:18px;font-weight:600;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;">📍 Краснодар</button>
        <button onclick="selectCity('msk')" style="width:100%;height:64px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:16px;color:#fff;font-size:18px;font-weight:600;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s;">📍 Москва</button>
    </div>
</div>

<div class="app">

    <!-- Header -->
    <header class="header">
        <div class="header__logo">
            <span class="header__logo-text">Точка Монтажа</span>
        </div>
        <button id="headerCityBtn" onclick="showCityScreen()" style="display:flex;align-items:center;gap:3px;color:rgba(255,255,255,0.8);font-size:12px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:12px;cursor:pointer;padding:5px 9px;white-space:nowrap;font-family:inherit;flex-shrink:0;">📍 <span id="cityLabel">—</span></button>
        <button class="header__cart" onclick="location.href='cart.html'" aria-label="Корзина">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="cart-badge hidden" id="cartBadge">0</span>
        </button>
    </header>

    <!-- Search -->
    <div class="search-wrap">
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Поиск по каталогу..."
                oninput="handleSearch()"
                autocomplete="off"
            >
            <button class="search-clear hidden" id="searchClear" onclick="clearSearch()">✕</button>
        </div>
    </div>

    <!-- Categories -->
    <div class="categories-scroll">
        <div class="categories" id="categories"></div>
    </div>

    <!-- Subcategories -->
    <div class="sub-scroll hidden" id="subScroll">
        <div class="subcategories" id="subcategories"></div>
    </div>

    <!-- Results count -->
    <div class="results-bar">
        <span id="resultsCount"></span>
    </div>

    <!-- Grid -->
    <main class="main">
        <div class="products-grid" id="productsGrid"></div>
        <div class="empty-state hidden" id="emptyState">
            <div class="empty-state__icon">🔍</div>
            <p class="empty-state__title">Ничего не найдено</p>
            <p class="empty-state__sub">Попробуйте изменить запрос</p>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <!-- Legal footer -->
    <div class="site-footer">
        <a class="site-footer__link" href="privacy.html">Конфиденциальность</a>
        <span class="site-footer__sep">·</span>
        <a class="site-footer__link" href="offer.html">Публичная оферта</a>
    </div>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                <rect x="15" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                <rect x="2" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                <rect x="15" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Каталог</span>
        </a>
        <a href="cart.html" class="nav-item" id="navCart">
            <div class="nav-icon-wrap">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="nav-badge hidden" id="navBadge">0</span>
            </div>
            <span>Корзина</span>
        </a>
        <a href="#" class="nav-item" id="navSupport" onclick="openSupport()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Поддержка</span>
        </a>
    </nav>

</div>
<script src="src/catalog/catalog.js"></script>
<script src="src/cookie.js"></script>
</body>
</html>
