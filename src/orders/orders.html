<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Точка Монтажа — Мои заказы</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="/src/shopGuard.js"></script>
    <script src="/src/utils/tgid.js?v=20260530b"></script>
    <style>
        @import url('/src/theme.css');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font-body);
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100dvh;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        button { cursor: pointer; border: none; background: none; font: inherit; }
        a { text-decoration: none; color: inherit; }
        .hidden { display: none !important; }

        .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-bottom: 80px; }

        .header {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center;
            height: 56px; padding: 0 8px 0 4px;
            background: var(--accent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.08);
        }
        .header__back {
            width: 44px; height: 44px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; color: var(--accent-ink); flex-shrink: 0;
        }
        .header__back:active { background: rgba(255,255,255,.16); }
        .header__title {
            flex: 1; text-align: center; font-size: 16px; font-weight: 700; letter-spacing: -.2px; color: var(--accent-ink);
        }
        .header__placeholder { width: 44px; flex-shrink: 0; }

        .content { padding: 16px 12px 24px; display: flex; flex-direction: column; gap: 12px; }

        .order-card {
            background: var(--bg-card);
            box-shadow: var(--card-shadow);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .order-card__header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .order-card__num { font-size: 16px; font-weight: 700; }
        .order-card__date { font-size: 12px; opacity: .55; }
        .order-badge {
            font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 10px;
        }
        .badge-new       { background: rgba(var(--ink-rgb),0.08); color: rgba(var(--ink-rgb),0.55); }
        .badge-in_progress { background: rgba(47,111,191,.2); color: var(--info); }
        .badge-shipped   { background: rgba(14,124,107,.15);   color: var(--accent); }
        .badge-completed { background: rgba(47,143,78,.18);    color: var(--success); }
        .badge-cancelled { background: rgba(192,57,43,.15);    color: var(--red); }

        .order-card__items { font-size: 13px; opacity: .75; line-height: 1.5; }
        .order-card__store { font-size: 13px; opacity: .65; }
        .order-card__address { font-size: 13px; color: rgba(var(--ink-rgb),0.55); margin: 4px 0; }
        .order-card__tracking { font-size: 13px; color: var(--accent); margin: 4px 0; }
        .order-card__total { font-size: 17px; font-weight: 700; color: var(--accent); }

        .track-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            height: 44px; background: rgba(14,124,107,0.15); border: 1px solid rgba(14,124,107,0.4);
            border-radius: var(--radius-md); color: var(--accent); font-size: 14px; font-weight: 600;
            width: 100%; text-decoration: none;
        }
        .track-btn:active { background: rgba(14,124,107,0.3); }

        .reorder-btn {
            display: flex; align-items: center; justify-content: center;
            height: 44px; width: 100%;
            background: rgba(var(--ink-rgb),0.06); border: 1px solid rgba(0,0,0,0.06);
            border-radius: var(--radius-md); color: var(--text-primary); font-size: 14px; font-weight: 600;
            cursor: pointer;
        }
        .reorder-btn:active { background: rgba(var(--ink-rgb),0.1); }

        .empty-state {
            display: flex; flex-direction: column; align-items: center;
            padding: 80px 24px; gap: 12px; text-align: center;
        }
        .empty-state__icon { display: flex; justify-content: center; color: var(--text-secondary); opacity: .5; }
        .empty-state__title { font-size: 17px; font-weight: 700; }
        .empty-state__sub { font-size: 13.5px; color: var(--text-secondary); }
        .empty-state__btn {
            margin-top: 8px; padding: 12px 28px; background: var(--accent);
            color: var(--accent-ink); border-radius: 14px; font-size: 15px; font-weight: 700;
        }

        .loading { text-align: center; padding: 60px 24px; font-size: 14px; opacity: .6; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: 64px;
            background: var(--bg-card);
            box-shadow: 0 -1px 8px rgba(0,0,0,0.08);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 100; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 3px; height: 100%;
            color: var(--text-secondary); font-size: 10.5px; font-weight: 600;
        }
        .nav-item.active { color: var(--accent); font-weight: 700; }
        .nav-item:active { opacity: .7; }
        .nav-ic {
            position: relative; width: 30px; height: 30px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        .nav-item.active .nav-ic { background: var(--accent); color: var(--accent-ink); }
        .nav-badge {
            position: absolute; top: -6px; right: -8px;
            min-width: 16px; height: 16px; background: var(--red); color: #FFFFFF;
            font-size: 9.5px; font-weight: 700; border-radius: 9px; padding: 0 4px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

            <span>Главная</span>
        </a>
        <a href="../../catalog.html" class="nav-item" id="navCatalog">

                    <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="nav-badge hidden" id="navBadge">0</span>
            </span>
            <span>Корзина</span>
        </a>
        <a href="../favorites/favorites.html" class="nav-item" id="navFavorites">
            <span class="nav-ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg></span>
            <span>Избранное</span>
        </a>
        <button class="nav-item" onclick="openSupport()">
            <span class="nav-ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg></span>
            <span>Поддержка</span>
        </button>
    </nav>
</div>
