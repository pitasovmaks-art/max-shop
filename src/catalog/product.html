<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Точка Монтажа</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="/src/shopGuard.js"></script>
    <script src="/src/utils/tgid.js?v=20260530b"></script>
    <style>
        :root {
            --bg-page:       #F0F7FF;
            --bg-card:       #FFFFFF;
            --bg-secondary:  #F0F4F8;
            --bg-input:      #F5F8FF;
            --text-primary:  #1C1C1E;
            --text-secondary:#6B7280;
            --border:        rgba(0,0,0,0.08);
            --red:           #EF4444;
            --header-h:      56px;
            --nav-h:         64px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #DCEEFF 0%, #B9D9F7 100%);
            background-attachment: fixed;
            color: #1C1C1E;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        button { cursor: pointer; border: none; background: none; font: inherit; }
        a { text-decoration: none; color: inherit; }
        .hidden { display: none !important; }

        /* ─── App ───────────────────────────────────────────── */
        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100dvh;
            background: transparent;
        }

        /* ─── Header ────────────────────────────────────────── */
        .header {
            position: sticky;
            top: 0; z-index: 100;
            display: flex;
            align-items: center;
            height: var(--header-h);
            padding: 0 8px 0 4px;
            background: linear-gradient(160deg, #DCEEFF 0%, #B9D9F7 100%);
            box-shadow: 0 1px 8px rgba(0,0,0,0.08);
        }
        .header__back {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            color: #0C447C;
            flex-shrink: 0;
        }
        .header__back:active { background: rgba(12,68,124,.10); }
        .header__title {
            flex: 1;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -.3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
            color: #0C447C;
        }
        .header__cart {
            position: relative;
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            color: #0C447C;
            flex-shrink: 0;
        }
        .header__cart:active { background: rgba(12,68,124,.10); }
        .cart-badge {
            position: absolute;
            top: 4px; right: 4px;
            min-width: 17px; height: 17px;
            background: #F85800;
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 700;
            border-radius: 9px;
            padding: 0 3px;
            display: flex; align-items: center; justify-content: center;
        }

        /* ─── Gallery ───────────────────────────────────────── */
        .gallery { background: var(--bg-card); position: relative; }

        .gallery__arrow {
            position: absolute;
            top: 132px;
            width: 36px; height: 36px;
            background: rgba(0,0,0,0.50);
            color: #FFFFFF;
            font-size: 26px;
            font-weight: 300;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            line-height: 1;
        }
        .gallery__arrow--prev { left: 12px; padding-right: 2px; }
        .gallery__arrow--next { right: 12px; padding-left: 2px; }
        .gallery__arrow:active { background: rgba(0,0,0,0.7); }

        .gallery__main {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: var(--bg-secondary);
        }
        .gallery__main img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .badge-out {
            position: absolute;
            top: 12px; right: 12px;
            background: #FFF0EB;
            color: #EF4444;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .gallery__strip-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 10px 12px;
            border-top: 1px solid rgba(0,0,0,0.06);
            background: linear-gradient(160deg, #DCEEFF 0%, #B9D9F7 100%);
        }
        .gallery__strip-wrap::-webkit-scrollbar { display: none; }

        .gallery__strip {
            display: flex;
            gap: 8px;
            width: max-content;
        }

        .gallery__thumb {
            width: 64px; height: 64px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color .15s;
        }
        .gallery__thumb img { width: 100%; height: 100%; object-fit: cover; }
        .gallery__thumb--active { border-color: #0C447C; }
        .gallery__thumb:active { opacity: .75; }

/* ─── Product info ───────────────────────────────────── */
        .product-info {
            background: rgba(255,255,255,0.92);
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border-radius: 16px;
            margin: 8px 12px 0;
            padding: 18px 16px calc(var(--nav-h) + 100px);
        }

        .product-name {
            font-size: 20px;
            font-weight: 800;
            color: #1C1C1E;
            letter-spacing: -.4px;
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 16px;
            color: rgba(28,28,30,0.75);
            line-height: 1.65;
            margin-bottom: 16px;
            white-space: pre-line;
        }

        /* ─── Variants ───────────────────────────────────────── */
        .variant-section { margin-bottom: 16px; }

        .variant-label {
            font-size: 12px;
            font-weight: 600;
            color: #0C447C;
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 8px;
        }

        .variant-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .variant-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid #F85800;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .15s, background .15s, color .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .variant-pill--active {
            border-color: #F85800;
            background: #F85800;
            color: #FFFFFF;
        }
        .variant-pill:active { opacity: .7; }

        /* ─── Fixed footer: price + button ──────────────────── */
        .product-footer {
            position: fixed;
            bottom: var(--nav-h);
            left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0,0.06);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 90;
        }

        .product-price {
            font-size: 22px;
            font-weight: 700;
            color: #F85800;
            flex-shrink: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .product-price--service {
            font-size: 16px;
            font-weight: 600;
            color: #F85800;
        }
        .price-old {
            font-size: 15px;
            font-weight: 400;
            color: #9CA3AF;
            text-decoration: line-through;
        }
        .price-sale {
            font-size: 22px;
            font-weight: 700;
            color: #FF3B30;
        }

        .add-to-cart-btn {
            flex: 1;
            height: 48px;
            background: #F85800;
            color: #FFFFFF;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            transition: background .15s, transform .1s;
        }
        .add-to-cart-btn:active { background: #D94F00; transform: scale(.98); }
        .add-to-cart-btn--disabled {
            background: #CCCCCC;
            color: #FFFFFF;
            opacity: 1;
            cursor: not-allowed;
        }
        .add-to-cart-btn--subscribed {
            background: rgba(255,214,10,0.2);
            color: #FFD60A;
            cursor: default;
        }
        .add-to-cart-btn--subscribed:active { transform: none; }

        /* ─── Toast ─────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            color: #FFFFFF;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
        }

        /* ─── Bottom nav ─────────────────────────────────────── */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 480px;
            height: var(--nav-h);
            background: #FFFFFF;
            box-shadow: 0 -1px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 100%;
            color: rgba(28,28,30,0.4);
            font-size: 11px;
        }
        .nav-item.active { color: #0C447C; }
        .nav-item:active { opacity: .7; }
        .nav-icon-wrap {
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-badge {
            position: absolute;
            top: -6px; right: -8px;
            min-width: 17px; height: 17px;
            background: #F85800;
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 700;
            border-radius: 9px;
            padding: 0 4px;
            display: flex; align-items: center; justify-content: center;
        }

        /* ─── Category backgrounds ───────────────────────────── */
        .cat-bg-1 { background: #2A2018; }
        .cat-bg-2 { background: #18202A; }
        .cat-bg-3 { background: #18261E; }
        .cat-bg-4 { background: #221A2A; }
        .cat-bg-5 { background: #2A1818; }
        .cat-bg-6 { background: #2A2318; }
    </style>
</head>
<body>
<div class="app">

    <header class="header">
        <button class="header__back"
            onclick="history.length > 1 ? history.back() : location.href='../../index.html'"
            aria-label="Назад">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <span class="header__title" id="pageTitle"></span>
        <button class="header__cart" onclick="location.href='../../cart.html'" aria-label="Корзина">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="cart-badge hidden" id="cartBadge">0</span>
        </button>
    </header>

    <!-- Gallery -->
    <div class="gallery">
        <div class="gallery__main" id="galleryMain"></div>
        <button class="gallery__arrow gallery__arrow--prev hidden" id="galleryArrowPrev" onclick="prevImage()">‹</button>
        <button class="gallery__arrow gallery__arrow--next hidden" id="galleryArrowNext" onclick="nextImage()">›</button>
<div class="gallery__strip-wrap hidden" id="galleryStripWrap">
            <div class="gallery__strip" id="galleryStrip"></div>
        </div>
    </div>

    <!-- Product info -->
    <div class="product-info">
        <h1 class="product-name" id="productName"></h1>

        <div class="variant-section hidden" id="variantSection">
            <div class="variant-label">Вариант</div>
            <div class="variant-pills" id="variantPills"></div>
        </div>

        <p class="product-desc hidden" id="productDesc"></p>
    </div>

    <!-- Fixed footer: price + add to cart -->
    <div class="product-footer">
        <div class="product-price" id="productPrice"></div>
        <button class="add-to-cart-btn" id="addToCartBtn">В корзину</button>
    </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Bottom nav -->
<nav class="bottom-nav">
    <a href="../../index.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="15" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="2" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="15" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Каталог</span>
    </a>
    <a href="../../cart.html" class="nav-item" id="navCart">
        <div class="nav-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
                <path d="M16 10a4 4 0 01-8 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-badge hidden" id="navBadge">0</span>
        </div>
        <span>Корзина</span>
    </a>
</nav>

<script src="product.js?v=20260530b"></script>
</body>
</html>
